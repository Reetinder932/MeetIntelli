services:
  db:
    image: postgres:15-alpine
    container_name: aimeeting-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aimeeting-network

  ollama:
    image: ollama/ollama:latest
    container_name: aimeeting-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aimeeting-network

  ai-service:
    build: ./ai-service
    container_name: aimeeting-ai-service
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_RECEIVER=${EMAIL_RECEIVER}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SERVICE_ACCOUNT_FILE=${SERVICE_ACCOUNT_FILE}
      - SPREADSHEET_ID=${SPREADSHEET_ID}
      - WORKSHEET_NAME=${WORKSHEET_NAME}
    ports:
      - "8002:8000"
    volumes:
      - ./ai-service/vector_stores:/app/vector_stores
      - ./ai-service/uploads:/app/uploads
    depends_on:
      - ollama
    networks:
      - aimeeting-network

  backend:
    build: ./backend
    container_name: aimeeting-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./backend/chat_media:/app/chat_media
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - APP_JWT_SECRET=${JWT_SECRET}
      - APP_JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      - APP_CORS_ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - APP_AI-SERVICE_URL=http://ai-service:8000
      - APP_N8N_WEBHOOK_URL=http://n8n:5678/webhook/meeting-summary
      - APP_N8N_OTP_WEBHOOK_URL=http://n8n:5678/webhook/send-otp
    depends_on:
      - db
      - ai-service
    networks:
      - aimeeting-network

  frontend:
    build: ./frontend
    container_name: aimeeting-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aimeeting-network

  bot-service:
    build: ./bot-service
    container_name: aimeeting-bot-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - aimeeting-network

  n8n:
    image: n8nio/n8n:latest
    container_name: aimeeting-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - aimeeting-network

volumes:
  pgdata:
  ollama_data:
  n8n_data:

networks:
  aimeeting-network:
    driver: bridge

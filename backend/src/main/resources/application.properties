spring.application.name=backend
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS}

# File Upload Configuration
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=-1

# External AI Service URL
app.ai-service.url=http://ai-service:8000

# n8n Webhook Configuration
app.n8n-webhook-url=${APP_N8N_WEBHOOK_URL:http://localhost:5678/webhook/meeting-summary}
app.n8n-otp-webhook-url=${APP_N8N_OTP_WEBHOOK_URL:http://localhost:5678/webhook/send-otp}

# Connection & Timeout Configurations (5 minutes)
server.connection-timeout=300000
server.tomcat.keep-alive-timeout=300000
spring.mvc.async.request-timeout=300000

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
